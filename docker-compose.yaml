name: music-tool-bot

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-music-tool-bot}-postgres
    command: [postgres, -p, "6003"]
    environment:
      PGPORT: "6003"
      POSTGRES_DB: ${DB_DATABASE:-music_tool_bot_dev}
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-${DB_USERNAME:-music_tool_bot}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-music_tool_bot_dev}
    # No host database port. Remote clients use the private SSH gateway.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 6003 -U ${DB_USERNAME:-music_tool_bot} -d ${DB_DATABASE:-music_tool_bot_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    image: music-tool-bot:prod
    container_name: ${COMPOSE_PROJECT_NAME:-music-tool-bot}-bot
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "6003"
      START_CMD: python bot.py
      PTB_TIMEDELTA: True
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bot_data:/data
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  bot_data:
  postgres_data:
