    نسخه: {version}

    اگر سؤال یا نظری دارید، می‌توانید در تلگرام به من پیام بدهید.
    اگر توسعه‌دهنده هستید و ایده‌ای برای بهبود بات دارید، از Pull Requestهای شما استقبال می‌کنم.
