  donationMessage: |
    شكرًا لاهتمامك بدعم عملي. أنا مطور وأقوم بتشغيل هذا البوت كهواية.
    سيساعدني تبرعك على الاستمرار في تطويره وتحسينه. إذا رغبت بالتبرّع، يمكنك استخدام إحدى الطرق التالية. شكرًا مقدمًا على دعمك.
