    By the way, if you're having problem processing your file, please enter /new command to start over.
  aboutMessage: |
    This bot was created by @amirhoseinsalimi using Python.
    The source code of this project is available on <a href="https://github.com/amirhoseinsalimi/music-tool-bot">GitHub</a>.
    Version: {version}

    If you have any questions or feedback, feel free to message me on Telegram.
    If you are a developer and have ideas to improve this bot, I welcome your pull requests.
