  musicCutterHelp: |
    Now send me <b>which part of the music</b> you want to cut out?
    
    The file length is <code>{length}</code> seconds.
    
    <b>Valid patterns:</b>
    <code>mm:ss-mm:ss</code>
    e.g. <code>00:10-02:30</code>
    
    <code>ss-ss</code>
    e.g. <code>75-120</code>
    
    <b>Notes:</b>
    - m = minute, s = second
    - Leading zeros are optional
    - Extra spaces are ignored
    - Only English numbers are valid
