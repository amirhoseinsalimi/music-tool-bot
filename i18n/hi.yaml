hi:
  tagPreviewSaveHint: "टैग जाँचें, नीचे दिए बटनों से संपादित करें, फिर फ़ाइल सहेजें चुनें।"
  starsPreviewTags: "👁 टैग देखें और संपादित करें"
  starsPreviewConflict: "आप दूसरी फ़ाइल पर काम कर रहे हैं। यह परिणाम खोलने से पहले उसे सहेजें या नई फ़ाइल चुनें। आपके मौजूदा बदलाव सुरक्षित हैं।"
  starsPreviewUnavailable: "यह पूर्वावलोकन उपलब्ध नहीं है। सहेजा गया परिणाम फिर से प्राप्त करें; नया काम न बनाएँ और दोबारा भुगतान न करें।"
  starsSuggestedMetadata: "सुझाए गए टैग:\nशीर्षक: {title}\nकलाकार: {artist}\nएल्बम: {album}\nवर्ष: {date}\n\nजाँचने, संपादित करने और सहेजने के लिए पूर्वावलोकन खोलें। पहचान शुरू होने के बाद किए गए बदलाव सुरक्षित रहेंगे।"
  btnPreviewTags: "👁 पूर्वावलोकन"
  btnSaveTags: "💾 फ़ाइल सहेजें"
  starsDevelopmentNotice: "विकास परीक्षण में असली स्टार लगते हैं। सार्वजनिक धनवापसी नीति तय नहीं है; समीक्षा के लिए /paysupport।"
  starsCancelled: "रद्द किया गया। प्रदाता को कुछ नहीं भेजा गया।"
  starsSubmitting: "आपका कार्य भेजा जा रहा है…"
  starsJobAccepted: "कार्य स्वीकार हुआ। तैयार होने पर परिणाम यहीं भेजूँगा।"
  starsJobFailed: "कार्य विफल हुआ। आरक्षित क्रेडिट लौटा दिए गए।"
  starsJobReview: "कार्य के लिए मालिक की समीक्षा चाहिए। इसे अपने आप दोबारा नहीं भेजा जाएगा।"
  starsJobExpired: "यह सहेजा गया परिणाम उपलब्ध नहीं है या इसकी 7-दिन की दावा अवधि समाप्त हो गई है। /paysupport से संपर्क करें। अगली बार, 7 दिनों के भीतर /premiumjob {job_id} से इसे पाएँ।"
  starsJobClaimLimit: "आपने आज परिणाम पाने की सीमा पूरी कर ली है। कल फिर कोशिश करें या परिणाम न मिलने पर /paysupport से संपर्क करें।"
  starsJobDeliveryTooLarge: "फ़ाइल बहुत बड़ी होने के कारण Telegram यह नतीजा नहीं भेज सका। कृपया समस्या की जाँच के लिए /paysupport से संपर्क करें। जाँच पूरी होने तक आपके क्रेडिट आरक्षित रहेंगे।"
  starsJobDeliveryRetrying: "नतीजा भेजते समय Telegram का समय समाप्त हो गया, इसलिए मैं डिलीवरी की पुष्टि नहीं कर सका। मैं अपने आप फिर कोशिश करूँगा। आप /premiumjob {job_id} से भी नतीजा पा सकते हैं। डिलीवरी की पुष्टि होने तक आपका क्रेडिट आरक्षित रहेगा।"
  starsJobDeliveryNeedsReview: "कई कोशिशों के बाद भी Telegram ने डिलीवरी की पुष्टि नहीं की। सहेजा हुआ नतीजा /premiumjob {job_id} से पाएँ; आपका क्रेडिट आरक्षित है। अगर नतीजा फिर भी न मिले, तो /paysupport से संपर्क करें।"
  starsJobReady: "कार्य पूरा हुआ। सहेजा परिणाम जल्द यहीं भेजा जाएगा।"
  starsJobDelivered: "यह कार्य पहले ही भेजा गया है। परिणाम फिर प्राप्त कर सकते हैं।"
