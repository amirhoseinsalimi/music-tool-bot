  starsCatalogNotice: "क्रेडिट पैक चुनें। अतिरिक्त मूल्य प्रति स्टार क्रेडिट की तुलना {stars} स्टार में {credits} क्रेडिट से करता है। क्रेडिट कभी समाप्त नहीं होते। पुष्टि से पहले हर कार्य की कीमत दिखेगी।"
