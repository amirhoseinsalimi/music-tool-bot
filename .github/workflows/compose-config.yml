name: Compose configuration
on:
  push:
    branches: [develop, master]
    paths:
      - docker-compose.yaml
      - docker-compose.dev.yaml
      - docker-compose.prod.yaml
      - docker-compose.grafana.yaml
      - docker/alloy/config.alloy
      - scripts/test_alloy_redaction.py
      - .env.example
      - README.md
      - scripts/check_compose_config.sh
      - .github/workflows/compose-config.yml
  pull_request:
    branches: [develop, master]
    paths:
      - docker-compose.yaml
      - docker-compose.dev.yaml
      - docker-compose.prod.yaml
      - docker-compose.grafana.yaml
      - docker/alloy/config.alloy
      - scripts/test_alloy_redaction.py
      - .env.example
      - README.md
      - scripts/check_compose_config.sh
      - .github/workflows/compose-config.yml
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/check_compose_config.sh
      - run: python3 scripts/test_alloy_redaction.py
