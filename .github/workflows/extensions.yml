name: Optional extension checks
on:
  push:
    branches: [develop, master]
    paths:
      - bot.py
      - utils/extensions.py
      - tests/extensions/**
      - .github/workflows/extensions.yml
  pull_request:
    branches: [develop, master]
    paths:
      - bot.py
      - utils/extensions.py
      - tests/extensions/**
      - .github/workflows/extensions.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/extensions -v
