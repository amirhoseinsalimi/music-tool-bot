name: Optional extension checks
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
    paths:
      - bot.py
      - utils/extensions.py
      - tests/extensions/**
      - .github/workflows/extensions.yml
      - .github/workflows/deploy-notify.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/extensions -v
